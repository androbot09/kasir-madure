<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Toko Madura - Barcode & Offline</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 16px; background: #f4f6f8; color: #222; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .header h2 { margin: 0; font-size: 18px; }
    .status { font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
    .online { background: #dcfce7; color: #166534; }
    .offline { background: #fef08a; color: #854d0e; }
    .card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .card h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .form-group { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    input { flex: 1; min-width: 110px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { padding: 10px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #2563eb; color: #fff; width: 100%; }
    .btn-scan { background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-scan-kasir { background: #7c3aed; color: #fff; width: 100%; margin-bottom: 12px; padding: 12px; font-size: 15px; }
    .btn-stop { background: #dc2626; color: #fff; width: 100%; margin-top: 8px; }
    .btn-buy { background: #16a34a; color: #fff; width: 100%; margin-top: 8px; }
    .btn-buy:disabled { background: #9ca3af; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .item { border: 1px solid #e5e7eb; padding: 12px; border-radius: 8px; background: #fafafa; }
    .item-code { font-size: 11px; color: #6b7280; font-family: monospace; }
    .item-name { font-weight: bold; font-size: 15px; margin: 2px 0 4px 0; }
    .item-price { color: #2563eb; font-weight: bold; font-size: 14px; }
    .item-stock { font-size: 13px; color: #555; margin-top: 4px; }
    .trx-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 13px; }
    #scannerBox { display: none; background: #000; border-radius: 10px; padding: 10px; margin-bottom: 16px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    #scanFeedback { color: #4ade80; text-align: center; font-weight: bold; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🏪 Kasir Toko Madura</h2>
    <span id="netStatus" class="status online">● Online</span>
  </div>

  <div id="scannerBox">
    <div id="reader"></div>
    <div id="scanFeedback">Arahkan kamera ke barcode barang...</div>
    <button class="btn-stop" onclick="tutupKamera()">✖ Tutup Kamera</button>
  </div>

  <div class="card">
    <h3>+ Tambah / Isi Ulang Barang</h3>
    <div class="form-group">
      <input type="text" id="barcodeBarang" placeholder="Kode Barcode (opsional)">
      <button class="btn-scan" onclick="bukaKamera('input')">📷 Scan</button>
    </div>
    <div class="form-group">
      <input type="text" id="namaBarang" placeholder="Nama (misal: Surya 16)">
      <input type="number" id="hargaBarang" placeholder="Harga (misal: 35000)">
      <input type="number" id="stokBarang" placeholder="Stok (misal: 20)">
    </div>
    <button class="btn-primary" onclick="tambahBarang()">Simpan Barang</button>
  </div>

  <div class="card">
    <h3>🛒 Kasir Cepat</h3>
    <button class="btn-scan-kasir" onclick="bukaKamera('kasir')">📷 Scan Barcode (Jual Otomatis)</button>
    <div id="daftarProduk" class="grid">Memuat data...</div>
  </div>

  <div class="card">
    <h3>🧾 5 Transaksi Terakhir</h3>
    <div id="riwayatTransaksi">Belum ada transaksi.</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
      collection, doc, setDoc, addDoc, updateDoc, increment, onSnapshot, query, orderBy, limit, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // KONFIGURASI FIREBASE PROYEK KASIR MADURE ANDA
    const firebaseConfig = {
      apiKey: "AIzaSyB0bfR0gRmZU8Gmk3vflYDgQX164lFjA28",
      authDomain: "kasir-madure.firebaseapp.com",
      projectId: "kasir-madure",
      storageBucket: "kasir-madure.firebasestorage.app",
      messagingSenderId: "537614514916",
      appId: "1:537614514916:web:8a8c520d0f0f6703710af1",
      measurementId: "G-PNF499VR0H"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });

    let produkMap = {}; 

    const statusEl = document.getElementById("netStatus");
    function updateOnlineStatus() {
      if (navigator.onLine) {
        statusEl.textContent = "● Online (Tersinkron)";
        statusEl.className = "status online";
      } else {
        statusEl.textContent = "● Offline (Mode Lokal)";
        statusEl.className = "status offline";
      }
    }
    window.addEventListener("online", updateOnlineStatus);
    window.addEventListener("offline", updateOnlineStatus);
    updateOnlineStatus();

    let html5QrCode = null;
    let modeScan = "kasir";
    let sedangsJedaScan = false;

    window.bukaKamera = function(mode) {
      modeScan = mode;
      document.getElementById("scannerBox").style.display = "block";
      document.getElementById("scanFeedback").textContent = mode === "input" 
        ? "Scan barcode untuk mengisi form..." 
        : "Scan barcode kemasan untuk langsung jual...";

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          if (sedangsJedaScan) return;
          bunyiBip();

          if (modeScan === "input") {
            document.getElementById("barcodeBarang").value = decodedText;
            tutupKamera();
          } else if (modeScan === "kasir") {
            sedangsJedaScan = true;
            prosesScanKasir(decodedText);
            setTimeout(() => { sedangsJedaScan = false; }, 2000);
          }
        },
        (errorMessage) => {}
      ).catch(err => {
        alert("Gagal membuka kamera. Pastikan izin kamera aktif.");
        tutupKamera();
      });
    };

    window.tutupKamera = function() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          document.getElementById("scannerBox").style.display = "none";
        });
      } else {
        document.getElementById("scannerBox").style.display = "none";
      }
    };

    function prosesScanKasir(kodeBarcode) {
      const feedbackEl = document.getElementById("scanFeedback");
      const produk = produkMap[kodeBarcode];

      if (!produk) {
        feedbackEl.style.color = "#f87171";
        feedbackEl.textContent = `❌ Barcode [${kodeBarcode}] belum terdaftar!`;
        return;
      }

      if (produk.stok <= 0) {
        feedbackEl.style.color = "#facc15";
        feedbackEl.textContent = `⚠️ Stok ${produk.nama} HABIS!`;
        return;
      }

      jualBarang(kodeBarcode, produk.nama, produk.harga);
      feedbackEl.style.color = "#4ade80";
      feedbackEl.textContent = `✅ Terjual 1x ${produk.nama} (Rp ${produk.harga.toLocaleString("id-ID")})`;
    }

    function bunyiBip() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    window.tambahBarang = async function() {
      const barcodeInput = document.getElementById("barcodeBarang").value.trim();
      const nama = document.getElementById("namaBarang").value.trim();
      const harga = Number(document.getElementById("hargaBarang").value);
      const stok = Number(document.getElementById("stokBarang").value);

      if (!nama || harga <= 0 || stok < 0) return alert("Isi nama, harga, dan stok dengan benar!");

      const idBarang = barcodeInput ? barcodeInput : nama.toLowerCase().replace(/[^a-z0-9]/g, "_");
      
      document.getElementById("barcodeBarang").value = "";
      document.getElementById("namaBarang").value = "";
      document.getElementById("hargaBarang").value = "";
      document.getElementById("stokBarang").value = "";

      await setDoc(doc(db, "products", idBarang), {
        barcode: barcodeInput || "-",
        nama: nama,
        harga: harga,
        stok: stok
      }, { merge: true });
    };

    window.jualBarang = async function(idBarang, namaBarang, harga) {
      const produkRef = doc(db, "products", idBarang);
      updateDoc(produkRef, { stok: increment(-1) });

      addDoc(collection(db, "transactions"), {
        barang: namaBarang,
        qty: 1,
        total: harga,
        waktu: new Date().toLocaleTimeString("id-ID", { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        timestamp: serverTimestamp()
      });
    };

    onSnapshot(collection(db, "products"), (snapshot) => {
      const container = document.getElementById("daftarProduk");
      container.innerHTML = "";
      produkMap = {};
      
      if (snapshot.empty) {
        container.innerHTML = "<p style='color:#777; font-size:13px;'>Belum ada barang. Silakan tambah di atas.</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        produkMap[id] = data;
        const habis = data.stok <= 0;

        container.innerHTML += `
          <div class="item">
            <div class="item-code">${data.barcode !== "-" ? "║▌ " + data.barcode : "Tanpa Barcode"}</div>
            <div class="item-name">${data.nama}</div>
            <div class="item-price">Rp ${data.harga.toLocaleString("id-ID")}</div>
            <div class="item-stock">Stok: <b>${data.stok}</b></div>
            <button class="btn-buy" ${habis ? "disabled" : ""} onclick="jualBarang('${id}', '${data.nama}', ${data.harga})">
              ${habis ? "Habis" : "Jual 1"}
            </button>
          </div>
        `;
      });
    });

    const qTrx = query(collection(db, "transactions"), orderBy("timestamp", "desc"), limit(5));
    onSnapshot(qTrx, (snapshot) => {
      const trxContainer = document.getElementById("riwayatTransaksi");
      trxContainer.innerHTML = "";

      if (snapshot.empty) {
        trxContainer.innerHTML = "<p style='color:#777; font-size:13px;'>Belum ada transaksi.</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const trx = docSnap.data();
        const pendingBadge = docSnap.metadata.hasPendingWrites ? "⏳" : "✅";
        trxContainer.innerHTML += `
          <div class="trx-item">
            <span>${pendingBadge} <b>${trx.barang}</b> (${trx.qty}x)</span>
            <span>Rp ${trx.total.toLocaleString("id-ID")} <small style="color:#888">(${trx.waktu})</small></span>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
